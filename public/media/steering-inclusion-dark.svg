  <text x="496" y="92" font-size="12" fill="#8B9DAF">gitops-conventions.md</text>
  <text x="496" y="112" font-size="11" fill="#8B9DAF">Cheap facts — load every turn</text>

  <rect x="480" y="184" width="320" height="128" rx="12" fill="#1A2332" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="496" y="212" font-size="13" font-weight="700" fill="#FF9900">fileMatch (conditional)</text>
  <text x="496" y="232" font-size="12" fill="#8B9DAF">archetypes · identity · policy</text>
