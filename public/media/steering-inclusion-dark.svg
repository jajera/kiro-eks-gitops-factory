  <rect x="40" y="108" width="210" height="120" rx="12" fill="#1A2332" stroke="#4DA8DA" stroke-width="2" filter="url(#s)"/>
  <text x="56" y="144" font-size="14" font-weight="700" fill="#E8EAED">Session starts</text>
  <text x="56" y="170" font-size="12" fill="#8B9DAF">Kiro opens a turn</text>
  <text x="56" y="192" font-size="12" fill="#8B9DAF">against this repo</text>

  <rect x="480" y="24" width="320" height="128" rx="12" fill="#1A2332" stroke="#4DA8DA" stroke-width="2" filter="url(#s)"/>
