  <line x1="365" y1="248" x2="482" y2="248" stroke="#6B7C8F" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="520" y="344" text-anchor="middle" font-size="12" fill="#8B9DAF" font-style="italic">Heavy archetype rules stay out of the window until `apps/**` is in play</text>
