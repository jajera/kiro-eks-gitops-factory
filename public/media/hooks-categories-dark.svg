<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="280" height="140" rx="12" fill="#1A2332" stroke="#FF6B4A" stroke-width="2" filter="url(#s)"/>
  <text x="36" y="52" font-size="14" font-weight="700" fill="#E8EAED">Shell gate</text>
  <text x="36" y="78" font-size="12" fill="#8B9DAF">block-infra-commands</text>
  <text x="36" y="100" font-size="12" fill="#8B9DAF">preToolUse on shell</text>
  <text x="36" y="130" font-size="11" fill="#8B9DAF">Denies kubectl/helm/terraform apply</text>
  <rect x="310" y="20" width="280" height="140" rx="12" fill="#1A2332" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="326" y="52" font-size="14" font-weight="700" fill="#E8EAED">Scaffold checks</text>
  <text x="326" y="78" font-size="12" fill="#8B9DAF">validate-app-scaffold</text>
  <text x="326" y="100" font-size="12" fill="#8B9DAF">validate-infra-scaffold</text>
  <text x="326" y="130" font-size="11" fill="#8B9DAF">fileEdited under apps/ or platform</text>
  <rect x="600" y="20" width="280" height="140" rx="12" fill="#1A2332" stroke="#4DA8DA" stroke-width="2" filter="url(#s)"/>
  <text x="616" y="52" font-size="14" font-weight="700" fill="#E8EAED">Build / policy</text>
  <text x="616" y="78" font-size="12" fill="#8B9DAF">kustomize + gator hooks</text>
  <text x="616" y="100" font-size="12" fill="#8B9DAF">policy-validate</text>
  <text x="616" y="130" font-size="11" fill="#8B9DAF">fileCreated / fileEdited on manifests</text>
  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#8B9DAF" font-style="italic">IDE-level hooks — enforce for every agent, including when no agent is selected</text>
</svg>
