<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="304" viewBox="0 0 1040 304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#879596"/></marker>
  </defs>

  <rect x="24" y="24" width="200" height="70" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="38" y="52" font-size="13" font-weight="700" fill="#232F3E">1 · Prompt</text>
  <text x="38" y="74" font-size="12" fill="#5A6A7E">Thin user intent</text>
  <rect x="280" y="24" width="200" height="70" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="294" y="52" font-size="13" font-weight="700" fill="#232F3E">2 · Agent</text>
  <text x="294" y="74" font-size="12" fill="#5A6A7E">Loads steering + skills</text>
  <rect x="536" y="24" width="200" height="70" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="550" y="52" font-size="13" font-weight="700" fill="#232F3E">3 · Skill</text>
  <text x="550" y="74" font-size="12" fill="#5A6A7E">Orders the work</text>
  <rect x="792" y="24" width="200" height="70" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="806" y="52" font-size="13" font-weight="700" fill="#232F3E">4 · File writes</text>
  <text x="806" y="74" font-size="12" fill="#5A6A7E">Manifests on disk</text>
  <rect x="24" y="182" width="200" height="70" rx="12" fill="#ffffff" stroke="#D13212" stroke-width="2" filter="url(#s)"/>
  <text x="38" y="210" font-size="13" font-weight="700" fill="#232F3E">5 · Hooks</text>
  <text x="38" y="232" font-size="12" fill="#5A6A7E">Validate / gate / deny</text>
  <rect x="280" y="182" width="200" height="70" rx="12" fill="#ffffff" stroke="#27AE60" stroke-width="2" filter="url(#s)"/>
  <text x="294" y="210" font-size="13" font-weight="700" fill="#232F3E">6 · Commit + PR</text>
  <text x="294" y="232" font-size="12" fill="#5A6A7E">Git change proposed</text>
  <rect x="536" y="182" width="200" height="70" rx="12" fill="#ffffff" stroke="#27AE60" stroke-width="2" filter="url(#s)"/>
  <text x="550" y="210" font-size="13" font-weight="700" fill="#232F3E">7 · Human review</text>
  <text x="550" y="232" font-size="12" fill="#5A6A7E">Merge judgement</text>
  <rect x="792" y="182" width="200" height="70" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="806" y="210" font-size="13" font-weight="700" fill="#232F3E">8 · Argo CD sync</text>
  <text x="806" y="232" font-size="12" fill="#5A6A7E">Cluster matches Git</text>
  <line x1="230" y1="59" x2="274" y2="59" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="59" x2="530" y2="59" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="742" y1="59" x2="786" y2="59" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M892,96 V138 H124 V172" fill="none" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="217" x2="274" y2="217" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486" y1="217" x2="530" y2="217" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="742" y1="217" x2="786" y2="217" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="288" text-anchor="middle" font-size="12" fill="#5A6A7E" font-style="italic">skills generate → hooks enforce → humans approve — then Argo CD syncs Git</text>
</svg>
