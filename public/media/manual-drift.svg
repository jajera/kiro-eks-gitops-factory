<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="206" height="140" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <circle cx="48" cy="48" r="16" fill="#147EBA" fill-opacity="0.12"/>
  <path d="M40 42h8l2 3h10v14H38V42h2zm2 5v10h12V47H50l-2-3h-6z" fill="#147EBA"/>
  <text x="72" y="44" font-size="13" font-weight="700" fill="#232F3E">Tree shape</text>
  <text x="72" y="62" font-size="11" fill="#5A6A7E">diverges</text>
  <text x="36" y="100" font-size="11" fill="#5A6A7E">deploy/ | k8s/envs/</text>
  <text x="36" y="118" font-size="11" fill="#5A6A7E">| flat root</text>
  <text x="36" y="140" font-size="11" fill="#879596">Cannot pattern-match</text>

  <rect x="236" y="16" width="206" height="140" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <circle cx="268" cy="48" r="16" fill="#FF9900" fill-opacity="0.12"/>
  <path d="M260 41h10l3 4v14h-16V45l3-4zm2 5v11h12V46h-2.5l-1.5-2h-4l-1.5 2H262z" fill="#FF9900"/>
  <text x="292" y="44" font-size="13" font-weight="700" fill="#232F3E">Naming</text>
  <text x="292" y="62" font-size="11" fill="#5A6A7E">collisions</text>
  <text x="256" y="100" font-size="11" fill="#5A6A7E">Same namespace or</text>
  <text x="256" y="118" font-size="11" fill="#5A6A7E">app label twice</text>
  <text x="256" y="140" font-size="11" fill="#879596">No convention held</text>

  <rect x="456" y="16" width="206" height="140" rx="12" fill="#ffffff" stroke="#D13212" stroke-width="2" filter="url(#s)"/>
  <circle cx="488" cy="48" r="16" fill="#D13212" fill-opacity="0.12"/>
  <circle cx="488" cy="48" r="9" fill="none" stroke="#D13212" stroke-width="2"/>
  <path d="M482 42l12 12M494 42l-12 12" stroke="#D13212" stroke-width="2" stroke-linecap="round"/>
  <text x="512" y="44" font-size="13" font-weight="700" fill="#232F3E">Policy gaps</text>
  <text x="512" y="62" font-size="11" fill="#5A6A7E">slip through</text>
  <text x="476" y="100" font-size="11" fill="#5A6A7E">Missing PDB</text>
  <text x="476" y="118" font-size="11" fill="#5A6A7E">runAsRoot: true</text>
  <text x="476" y="140" font-size="11" fill="#879596">Nothing blocked it</text>

  <rect x="676" y="16" width="206" height="140" rx="12" fill="#ffffff" stroke="#7D3AC1" stroke-width="2" filter="url(#s)"/>
  <circle cx="708" cy="48" r="16" fill="#7D3AC1" fill-opacity="0.12"/>
  <path d="M708 39l2.2 6.5H717l-5.3 4 2.1 6.5-5.8-4.1-5.8 4.1 2.1-6.5-5.3-4h6.8z" fill="#7D3AC1"/>
  <text x="732" y="44" font-size="13" font-weight="700" fill="#232F3E">Prompt drift</text>
  <text x="732" y="62" font-size="11" fill="#5A6A7E">each session</text>
  <text x="696" y="100" font-size="11" fill="#5A6A7E">Unconstrained model</text>
  <text x="696" y="118" font-size="11" fill="#5A6A7E">invents a new layout</text>
  <text x="696" y="140" font-size="11" fill="#879596">Plausible != consistent</text>

  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#5A6A7E" font-style="italic">Small differences compound into a different shape in every directory</text>
</svg>
