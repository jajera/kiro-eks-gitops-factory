<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6B7C8F"/></marker>
  </defs>

  <rect x="40" y="40" width="200" height="110" rx="12" fill="#1A2332" stroke="#FF6B4A" stroke-width="2" filter="url(#s)"/>
  <text x="56" y="72" font-size="13" font-weight="700" fill="#E8EAED">Chat / out-of-band</text>
  <text x="56" y="96" font-size="12" fill="#8B9DAF">`kubectl apply` urge</text>
  <text x="56" y="118" font-size="12" fill="#8B9DAF">or live cluster mutate</text>

  <rect x="320" y="40" width="240" height="110" rx="12" fill="#1A2332" stroke="#4DA8DA" stroke-width="2" filter="url(#s)"/>
  <text x="336" y="72" font-size="13" font-weight="700" fill="#4DA8DA">1 · Shell gate</text>
  <text x="336" y="96" font-size="12" fill="#8B9DAF">Deny apply from chat</text>
  <text x="336" y="118" font-size="12" fill="#8B9DAF">Allow `kustomize build`</text>

  <rect x="640" y="40" width="260" height="110" rx="12" fill="#1A2332" stroke="#2ECC71" stroke-width="2" filter="url(#s)"/>
  <text x="656" y="72" font-size="13" font-weight="700" fill="#2ECC71">2 · Argo CD sync</text>
  <text x="656" y="96" font-size="12" fill="#8B9DAF">Cluster matches Git</text>
  <text x="656" y="118" font-size="12" fill="#8B9DAF">Out-of-band apply does not stick</text>

  <line x1="240" y1="95" x2="318" y2="95" stroke="#6B7C8F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="95" x2="638" y2="95" stroke="#6B7C8F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="190" text-anchor="middle" font-size="12" fill="#8B9DAF" font-style="italic">Prevention in the IDE — Git remains authoritative on the cluster</text>
</svg>
