<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="280" height="140" rx="12" fill="#ffffff" stroke="#D13212" stroke-width="2" filter="url(#s)"/>
  <text x="36" y="52" font-size="14" font-weight="700" fill="#232F3E">Shell gate</text>
  <text x="36" y="78" font-size="12" fill="#5A6A7E">block-infra-commands</text>
  <text x="36" y="100" font-size="12" fill="#5A6A7E">preToolUse on shell</text>
  <text x="36" y="130" font-size="11" fill="#5A6A7E">Denies kubectl/helm/terraform apply</text>
  <rect x="310" y="20" width="280" height="140" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="326" y="52" font-size="14" font-weight="700" fill="#232F3E">Scaffold checks</text>
  <text x="326" y="78" font-size="12" fill="#5A6A7E">validate-app-scaffold</text>
  <text x="326" y="100" font-size="12" fill="#5A6A7E">validate-infra-scaffold</text>
  <text x="326" y="130" font-size="11" fill="#5A6A7E">fileEdited under apps/ or platform</text>
  <rect x="600" y="20" width="280" height="140" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="616" y="52" font-size="14" font-weight="700" fill="#232F3E">Build / policy</text>
  <text x="616" y="78" font-size="12" fill="#5A6A7E">kustomize + gator hooks</text>
  <text x="616" y="100" font-size="12" fill="#5A6A7E">policy-validate</text>
  <text x="616" y="130" font-size="11" fill="#5A6A7E">fileCreated / fileEdited on manifests</text>
  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#5A6A7E" font-style="italic">IDE-level hooks — enforce for every agent, including when no agent is selected</text>
</svg>
