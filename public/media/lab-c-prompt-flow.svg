<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#879596"/></marker>
  </defs>

  <rect x="40" y="24" width="200" height="88" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="54" y="54" font-size="13" font-weight="700" fill="#232F3E">1 · Empty apps/</text>
  <text x="54" y="78" font-size="12" fill="#5A6A7E">Only `.gitkeep` in the repo</text>
  <rect x="320" y="24" width="200" height="88" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="334" y="54" font-size="13" font-weight="700" fill="#232F3E">2 · Thin prompt</text>
  <text x="334" y="78" font-size="12" fill="#5A6A7E">Name, image, host, replicas</text>
  <rect x="600" y="24" width="200" height="88" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="614" y="54" font-size="13" font-weight="700" fill="#232F3E">3 · add-app</text>
  <text x="614" y="78" font-size="12" fill="#5A6A7E">Steering + skill fill the rest</text>
  <rect x="40" y="184" width="200" height="88" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="2" filter="url(#s)"/>
  <text x="54" y="214" font-size="13" font-weight="700" fill="#232F3E">4 · Dual overlays</text>
  <text x="54" y="238" font-size="12" fill="#5A6A7E">dev-eks-1 and prod-eks-1</text>
  <rect x="320" y="184" width="200" height="88" rx="12" fill="#ffffff" stroke="#27AE60" stroke-width="2" filter="url(#s)"/>
  <text x="334" y="214" font-size="13" font-weight="700" fill="#232F3E">5 · PR + human</text>
  <text x="334" y="238" font-size="12" fill="#5A6A7E">Review, then merge</text>
  <rect x="600" y="184" width="200" height="88" rx="12" fill="#ffffff" stroke="#147EBA" stroke-width="2" filter="url(#s)"/>
  <text x="614" y="214" font-size="13" font-weight="700" fill="#232F3E">6 · Argo CD sync</text>
  <text x="614" y="238" font-size="12" fill="#5A6A7E">Git wins on the cluster</text>
  <line x1="246" y1="68" x2="314" y2="68" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="526" y1="68" x2="594" y2="68" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,114 V148 H140 V176" fill="none" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246" y1="228" x2="314" y2="228" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="526" y1="228" x2="594" y2="228" stroke="#879596" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="304" text-anchor="middle" font-size="12" fill="#5A6A7E" font-style="italic">Prompt names the app — the factory shapes the tree, then GitOps lands it</text>
</svg>
